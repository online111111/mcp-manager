name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }} / Go ${{ matrix.go }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            go: '1.25.8'
            current: false
          - os: windows-latest
            go: '1.25.8'
            current: false
          - os: macos-latest
            go: '1.25.8'
            current: false
          - os: ubuntu-latest
            go: '1.27.3'
            current: true
          - os: windows-latest
            go: '1.27.3'
            current: true
          - os: macos-latest
            go: '1.27.3'
            current: true
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ matrix.go }}
          cache: true
      - name: Repository identity checks
        if: runner.os == 'Linux' && matrix.current
        shell: bash
        run: |
          set -euo pipefail
          test "$(head -n 1 go.mod)" = 'module github.com/online111111/mcp-manager'
          test -d cmd/mcp-manager
          test ! -e cmd/mcp-hub
          if git grep -n -I 'online111111/mcp-hub' -- . ':!.github/workflows/ci.yml'; then
            echo 'historical repository slug remains' >&2
            exit 1
          fi
          if git grep -n -I 'mcp-hub' -- . ':!.github/workflows/ci.yml'; then
            echo 'lowercase legacy product/binary name remains' >&2
            exit 1
          fi
      - name: Set up Node
        if: runner.os == 'Linux' && matrix.current
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - name: Admin UI unit tests
        if: runner.os == 'Linux' && matrix.current
        run: |
          node --check internal/admin/web/app.js
          node --test internal/admin/webtest/*.test.mjs
      - name: Install browser regression dependencies
        if: runner.os == 'Linux' && matrix.current
        working-directory: internal/admin/browsertest
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Chromium UI regressions
        if: runner.os == 'Linux' && matrix.current
        working-directory: internal/admin/browsertest
        run: npm test
      - name: Test
        run: go test -count=1 -timeout 180s ./...
      - name: Race test
        if: matrix.current
        run: go test -race -count=1 -timeout 240s ./...
      - name: Vet
        run: go vet ./...
      - name: SDK probe
        if: matrix.current
        working-directory: verification/sdkprobe
        run: go test -race -count=1 -timeout 120s ./...
      - name: Integrated Chromium smoke against real Manager
        if: runner.os == 'Linux' && matrix.current
        run: |
          go build -trimpath -o dist/mcp-manager ./cmd/mcp-manager
          node internal/admin/browsertest/live-smoke.mjs
      - name: Build MCP Manager
        run: go build -trimpath ./cmd/mcp-manager
      - name: Windows packaged CMD, PowerShell 5.1 and recovery regressions
        if: runner.os == 'Windows' && matrix.current
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force windows-package | Out-Null
          go build -trimpath -o windows-package/mcp-manager.exe ./cmd/mcp-manager
          if ($LASTEXITCODE -ne 0) { throw 'Windows build failed' }
          Copy-Item scripts/windows/start-mcp-manager.* windows-package/
          Copy-Item scripts/windows/copy-admin-token.* windows-package/
          Copy-Item scripts/windows/README-WINDOWS.txt,README.md windows-package/
          Compress-Archive -Path windows-package/* -DestinationPath windows-smoke.zip
          $version = ((& windows-package/mcp-manager.exe version) -replace '^mcp-manager ', '').Trim()
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File scripts/windows/smoke.ps1 -ArchivePath "$PWD/windows-smoke.zip" -ExpectedVersion $version
          if ($LASTEXITCODE -ne 0) { throw 'Windows packaged smoke failed' }
      - name: Windows browser test dependencies
        if: runner.os == 'Windows' && matrix.current
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - name: Windows Chromium and real API persistence
        if: runner.os == 'Windows' && matrix.current
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Push-Location internal/admin/browsertest
          npm ci
          if ($LASTEXITCODE -ne 0) { throw 'npm ci failed' }
          npx playwright install chromium
          if ($LASTEXITCODE -ne 0) { throw 'Chromium installation failed' }
          npm test
          if ($LASTEXITCODE -ne 0) { throw 'Windows browser regressions failed' }
          Pop-Location
          $env:MCP_MANAGER_BINARY = "$PWD/windows-package/mcp-manager.exe"
          node internal/admin/browsertest/live-smoke.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Windows real API smoke failed' }

  vulnerability-scan:
    name: Govulncheck / Go 1.27.3
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Govulncheck
        uses: golang/govulncheck-action@032d45514ae346b1db93c04b0c90b841c370344f # v1
        with:
          repo-checkout: false
          go-version-input: '1.27.3'
          go-package: ./...
