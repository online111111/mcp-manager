name: Release

on:
  push:
    tags: ['v*']
  workflow_call:
    inputs:
      version:
        description: Stable release tag, such as v0.4.5
        required: true
        type: string
      commit:
        description: Exact reviewed source commit SHA
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.version || github.ref_name }}
  cancel-in-progress: false

jobs:
  build:
    name: Build reviewed release archives
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      tag: ${{ steps.identity.outputs.tag }}
      sha: ${{ steps.identity.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.commit || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.1'
      - name: Validate exact source identity
        id: identity
        env:
          TAG: ${{ inputs.version || github.ref_name }}
          EXPECTED_SHA: ${{ inputs.commit || github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          grep -Fq "Version   = \"${TAG#v}\"" internal/buildinfo/buildinfo.go
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            test "$(git rev-list -n1 "$TAG")" = "$EXPECTED_SHA"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "sha=$EXPECTED_SHA" >> "$GITHUB_OUTPUT"
      - name: Source, SDK and vulnerability gates
        run: |
          go test -count=1 -timeout 180s ./...
          go vet ./...
          (cd verification/sdkprobe && go test -count=1 -timeout 120s ./...)
          go install golang.org/x/vuln/cmd/govulncheck@v1.7.0
          govulncheck ./...
      - name: Build all six archives once
        env:
          TAG: ${{ steps.identity.outputs.tag }}
        run: bash scripts/build-release.sh "$TAG"
      - name: Retain exact artifacts for verification and publication
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-dist
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  verify-windows:
    name: Native Windows exact ZIP and browser/API
    needs: build
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.build.outputs.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-dist
          path: dist
      - name: Check archive checksum and run actual CMD entrypoint in PowerShell 5.1
        env:
          RELEASE_TAG: ${{ needs.build.outputs.tag }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $version = $env:RELEASE_TAG.Substring(1)
          $name = "mcp-manager-$version-windows-amd64.zip"
          $line = Get-Content dist/SHA256SUMS | Where-Object { $_.EndsWith("  $name") }
          if (@($line).Count -ne 1) { throw 'Expected one matching Windows checksum' }
          if ((Get-FileHash "dist/$name" -Algorithm SHA256).Hash -ine $line.Substring(0,64)) { throw 'Windows ZIP checksum mismatch' }
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File scripts/windows/smoke.ps1 -ArchivePath "$PWD/dist/$name" -ExpectedVersion $version
          if ($LASTEXITCODE -ne 0) { throw 'Native Windows packaged smoke failed' }
          Expand-Archive -LiteralPath "dist/$name" -DestinationPath verified-windows
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - name: Real Chromium login, CSRF and Windows atomic config persistence
        shell: pwsh
        run: |
          Push-Location internal/admin/browsertest
          npm ci
          if ($LASTEXITCODE -ne 0) { throw 'npm ci failed' }
          npx playwright install chromium
          if ($LASTEXITCODE -ne 0) { throw 'Chromium installation failed' }
          Pop-Location
          $env:MCP_MANAGER_BINARY = "$PWD/verified-windows/mcp-manager.exe"
          node internal/admin/browsertest/live-smoke.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Exact Windows binary browser/API smoke failed' }

  verify-posix:
    name: Native archive smoke / ${{ matrix.os }}
    needs: build
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-dist
          path: dist
      - name: Verify and execute the final native archive
        env:
          RELEASE_TAG: ${{ needs.build.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          case "$(uname -s)" in Linux) os=linux;; Darwin) os=darwin;; *) exit 1;; esac
          case "$(uname -m)" in x86_64) arch=amd64;; arm64|aarch64) arch=arm64;; *) exit 1;; esac
          (cd dist && shasum -a 256 -c SHA256SUMS)
          name="mcp-manager-${RELEASE_TAG#v}-${os}-${arch}.tar.gz"
          mkdir verified
          tar -xzf "dist/$name" -C verified
          cd verified
          test "$(./mcp-manager version)" = "mcp-manager ${RELEASE_TAG#v}"
          printf '%s\n' '{"version":1,"hub":{"listen":"127.0.0.1:18973","admin":{"enabled":true,"token":"release-smoke-admin-token-000000000001"}},"mcpServers":{}}' > config.json
          ./mcp-manager validate --config config.json
          ./mcp-manager serve --config config.json > run.log 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true; wait "$pid" 2>/dev/null || true' EXIT
          for i in $(seq 1 100); do
            if curl -fsS http://127.0.0.1:18973/readyz >/dev/null 2>&1; then break; fi
            kill -0 "$pid"
            sleep 0.1
          done
          ./mcp-manager doctor --endpoint http://127.0.0.1:18973
          curl -fsS http://127.0.0.1:18973/admin/ >/dev/null

  publish:
    name: Publish only verified archives
    needs: [build, verify-windows, verify-posix]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.build.outputs.sha }}
          fetch-depth: 0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-dist
          path: dist
      - name: Verify identity and checksums, then publish without rebuilding
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.build.outputs.tag }}
          RELEASE_SHA: ${{ needs.build.outputs.sha }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$RELEASE_SHA"
          (cd dist && sha256sum -c SHA256SUMS)
          test "$(find dist -maxdepth 1 -type f | wc -l)" -eq 7
          if git rev-parse -q --verify "refs/tags/$RELEASE_TAG" >/dev/null; then
            test "$(git rev-list -n1 "$RELEASE_TAG")" = "$RELEASE_SHA"
          else
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git tag -a "$RELEASE_TAG" "$RELEASE_SHA" -m "MCP Manager $RELEASE_TAG"
            git push origin "refs/tags/$RELEASE_TAG"
          fi
          gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes dist/*
